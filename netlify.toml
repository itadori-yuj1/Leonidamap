[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/app.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/locations.json"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# /index.html и / отдавали одинаковый контент как два разных URL — Google
# расценил это как дубликат страницы без явно выбранного canonical.
# Редирект на уровне сервера — более сильный сигнал для поисковика, чем
# просто <link rel="canonical">, полностью убирает второй URL из обращения.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Чтобы /about и /privacy (без .html на конце) тоже открывали страницы —
# на случай, если кто-то введёт адрес руками или перейдёт по старой ссылке
# без расширения файла.
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 301
  force = true
